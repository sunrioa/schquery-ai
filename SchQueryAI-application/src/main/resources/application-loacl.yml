# 本地开发覆盖配置。不要在此文件写入真实密码或 API Key。
spring:
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:30000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:10000ms}
        shutdown-timeout: ${REDIS_SHUTDOWN_TIMEOUT:10000ms}
        command-timeout: ${REDIS_COMMAND_TIMEOUT:20000ms}

  ai:
    openai:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v1}
          dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1536}
          topK: ${RAG_TOP_K:6}
          similarityThreshold: ${RAG_SIMILARITY_THRESHOLD:0.25}

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:schqueryai}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}

    search:
      options:
        apiKey: ${SEARCH_API_KEY:}
        engine: ${SEARCH_ENGINE:baidu}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/schqueryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false&socketTimeout=30000&connectTimeout=10000&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      max-lifetime: ${DB_MAX_LIFETIME:900000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      minimum-idle: ${DB_MINIMUM_IDLE:2}
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:10}
      connection-test-query: SELECT 1
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      keepalive-time: ${DB_KEEPALIVE_TIME:30000}

email:
  host: ${EMAIL_HOST:smtp.qq.com}
  port: ${EMAIL_PORT:465}
  username: ${EMAIL_USERNAME:}
  password: ${EMAIL_PASSWORD:}
  from: ${EMAIL_FROM:${EMAIL_USERNAME:}}

server:
  port: ${SERVER_PORT:8080}

parameters:
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  region: ${MINIO_REGION:us-east-1}
  bucket: ${MINIO_BUCKET:files}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
