# Spring Boot 应用配置文件
spring:
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:200MB}
      file-size-threshold: ${UPLOAD_FILE_SIZE_THRESHOLD:10MB}
      location: ${UPLOAD_TMP_DIR:/data/tmp/upload}

  http:
    client:
      connect-timeout: 30s
      read-timeout: 30s

  ai:
    openai:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}

      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v1}
          dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1536}
          topK: ${RAG_TOP_K:6}
          similarityThreshold: ${RAG_SIMILARITY_THRESHOLD:0.25}

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:schqueryai}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}

    search:
      options:
        apiKey: ${SEARCH_API_KEY:}
        engine: ${SEARCH_ENGINE:baidu}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/schqueryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# 邮件服务配置
email:
  host: ${EMAIL_HOST:smtp.qq.com}
  port: ${EMAIL_PORT:465}
  username: ${EMAIL_USERNAME:}
  password: ${EMAIL_PASSWORD:}
  from: ${EMAIL_FROM:${EMAIL_USERNAME:}}

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    async-timeout: ${TOMCAT_ASYNC_TIMEOUT:30000}

# 语音识别（Aliyun ASR）配置
parameters:
  asr:
    endpoint: ${ALIYUN_ASR_ENDPOINT:wss://dashscope.aliyuncs.com/api-ws/v1/inference} # WebSocket地址
    apiKey: ${ALIYUN_ASR_API_KEY:} # 建议通过环境变量注入
    authHeaderName: "Authorization"
    authHeaderValue: ${ALIYUN_ASR_AUTH_HEADER_VALUE:} # 可选，优先于apiKey
    subprotocol: "" # 如需子协议可配置
    model: "fun-asr-realtime-2025-11-07"
    format: "pcm"
    sampleRate: 16000
    enableIntermediateResult: true
    enablePunctuation: true
    enableInverseTextNormalization: true
    hotWords: ""
    useHeaderPayload: true
    chunkBytes: 960
    chunkIntervalMs: 10
    connectTimeoutMs: 10000
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}
  widget:
    siteKey: ${WIDGET_SITE_KEY:demo-site-key}
    title: ${WIDGET_TITLE:SchQueryAI}
    subtitle: ${WIDGET_SUBTITLE:AI Assistant}
    primaryColor: ${WIDGET_PRIMARY_COLOR:#1d4ed8}
    backgroundColor: ${WIDGET_BACKGROUND_COLOR:#ffffff}
    textColor: ${WIDGET_TEXT_COLOR:#0f172a}
    allowedOrigin: ${WIDGET_ALLOWED_ORIGIN:https://example.com}

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  region: ${MINIO_REGION:us-east-1}
  bucket: ${MINIO_BUCKET:files}

# DashScope 兼容模式/Rerank/意图识别共用密钥
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

#debug: true
