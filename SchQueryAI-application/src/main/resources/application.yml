spring:
  data:
    redis:
      database: 0
      host: localhost  # Your Redis server IP/domain
      port: 6379       # Default Redis port
      timeout: 2000ms  # Connection timeout
      lettuce: # Lettuce is the default client; configure pool if needed
        pool:
          max-active: 8  # Max connections
          max-idle: 8    # Max idle connections
          min-idle: 2    # Min idle connections

  servlet:
    multipart:
      enabled: true  # 开启文件上传（默认true）
      max-file-size: 100MB  # 单文件最大大小
      max-request-size: 200MB  # 单次请求总大小
      file-size-threshold: 10MB  # 阈值：超过则写入磁盘
      location: /data/tmp/upload  # 临时文件目录

  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}

      chat:
        options:
          model: qwen-plus

      embedding:
        options:
          model: text-embedding-v1
          dimensions: 1024

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        api-key: xxxx
        collection-name: gzhhxy
        use-tls: false
        initialize-schema: true


  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/schqueryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${PASSWORD}

email:
  host: smtp.qq.com
  port: 465
  username: user@example.com
  password: ${EMAIL_PASSWORD}
  from: user@example.com

server:
  port: 8080

parameters:
  model: "offline"  # 必须为"offline"，FunASR离线模式强制要求
  hotWords: "{\"自定义\":20,\"热词\":20,\"设置\":30}"  # 正确：JSON格式需转义双引号（YAML中双引号内的"需用\"转义）
  serverIpPort: "ws://127.0.0.1:10095"  # 本地FunASR服务器地址（127.0.0.1=本地，10095=端口）
  funasr:  # 二级节点，对应代码中@Value读取的层级
    subprotocol: "funasr-ws"  # 子协议（1.0+版本用funasr-ws，旧版本需改为"funasr"）