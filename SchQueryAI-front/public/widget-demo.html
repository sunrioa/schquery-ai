<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchQueryAI Widget 接入示例</title>
    <style>
      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }
      .demo-shell {
        max-width: 960px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }
      .demo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      .demo-header h1 {
        font-size: 20px;
        margin: 0;
      }
      .demo-header span {
        font-size: 13px;
        color: #64748b;
      }
      .demo-content {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 24px;
        align-items: start;
      }
      .demo-card {
        background: #f8fafc;
        border-radius: 12px;
        padding: 16px;
        border: 1px dashed #cbd5f5;
      }
      .demo-card p {
        margin-top: 0;
        color: #475569;
        line-height: 1.6;
      }
      .demo-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .demo-actions input {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #dbe0ef;
        font-size: 14px;
      }
      .demo-actions button {
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: #1d4ed8;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }
      .demo-widget {
        width: 100%;
        height: 560px;
        border: none;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="demo-shell">
      <div class="demo-header">
        <div>
          <h1>SchQueryAI Widget 接入示例</h1>
          <span>修改 siteKey 后点击“加载 Widget”即可体验</span>
        </div>
      </div>
      <div class="demo-content">
        <div class="demo-card">
          <p>这是一个外部网站接入示例页面。你只需要配置 siteKey，并引入一个 iframe，即可将 AI 对话挂载到任何网页中。</p>
          <div class="demo-actions">
            <label>
              <span>siteKey</span>
              <input id="siteKeyInput" value="demo-site-key" />
            </label>
            <button id="loadBtn">加载 Widget</button>
            <button id="toggleBtn">显示/隐藏</button>
          </div>
        </div>
        <iframe id="widgetFrame" class="demo-widget" src="http://localhost:80/widget/chat?siteKey=demo-site-key"></iframe>
      </div>
    </div>

    <script>
      const siteKeyInput = document.getElementById('siteKeyInput');
      const loadBtn = document.getElementById('loadBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const widgetFrame = document.getElementById('widgetFrame');

      const widgetBaseUrl = 'http://localhost:80';

      loadBtn.addEventListener('click', () => {
        const siteKey = siteKeyInput.value.trim() || 'demo-site-key';
        widgetFrame.src = `${widgetBaseUrl}/widget/chat?siteKey=${encodeURIComponent(siteKey)}`;
      });

      toggleBtn.addEventListener('click', () => {
        widgetFrame.classList.toggle('hidden');
      });
    </script>
  </body>
</html>
