server:
  port: 8081

spring:
  ai:
    mcp:
      server:
        name: schqueryai-mcp-server
        version: 1.0.0
        enabled: true
        protocol: SSE
        type: SYNC

tavily:
  api-key: ${TAVILY_API_KEY:}
  api-url: ${TAVILY_API_URL:https://api.tavily.com}
  search-depth: ${TAVILY_SEARCH_DEPTH:basic}
  max-results: ${TAVILY_MAX_RESULTS:5}
  include-raw-content: ${TAVILY_INCLUDE_RAW_CONTENT:false}
  include-images: ${TAVILY_INCLUDE_IMAGES:false}
