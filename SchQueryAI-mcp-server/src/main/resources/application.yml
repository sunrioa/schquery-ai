server:
  port: 8081

spring:
  ai:
    mcp:
      server:
        name: schqueryai-mcp-server
        version: 1.0.0
        enabled: true
        protocol: SSE
        type: SYNC

tavily:
  # 建议通过环境变量配置：TAVILY_API_KEY
  api-key: ${TAVILY_API_KEY}
  api-url: https://api.tavily.com
  search-depth: basic
  max-results: 5
  include-raw-content: false
  include-images: false

