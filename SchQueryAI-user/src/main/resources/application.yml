server:
  port: 8081

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/schqueryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      pool-name: HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce: # Lettuce is the default client; configure pool if needed
        pool:
          max-active: 8  # Max connections
          max-idle: 8    # Max idle connections
          min-idle: 2    # Min idle connections

  # 邮件配置
  mail:
    host: ${EMAIL_HOST:smtp.qq.com}
    port: ${EMAIL_PORT:465}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          starttls:
            enable: true
            required: true
    from: ${EMAIL_FROM:${EMAIL_USERNAME:}}

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: cn.ling.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

# 邮件配置属性
mail-notify:
  host: ${EMAIL_HOST:smtp.qq.com}
  port: ${EMAIL_PORT:465}
  username: ${EMAIL_USERNAME:}
  password: ${EMAIL_PASSWORD:}
  from: ${EMAIL_FROM:${EMAIL_USERNAME:}}

# JWT配置
jwt:
  secret: ${JWT_SECRET_KEY:change-this-jwt-secret-key-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时，单位毫秒

# 日志配置
logging:
  level:
    cn.ling.mapper: debug
    org.springframework.web: debug
    root: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
